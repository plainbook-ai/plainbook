[build-system]
# Defines the tools needed to build your package
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plainbook"
version = "0.6.1"
description = "Plain Language Notebooks"
readme = "README.md"
requires-python = ">=3.8"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
authors = [
    {name = "Luca de Alfaro", email = "dealfaro@acm.org"}
]
keywords = ["notebook", "jupyter", "natural language", "data science"]

dependencies = [
    "anthropic",
    "bottle",
    "cherrypy",
    "google-genai",
    "py-machineid",
    "google-cloud-storage",
    "snapshot-kernel>=0.2.0",
    "nbformat",
    "openai",
    "pyyaml",
    "requests",
    # Unpacks the Ollama runtime archive, which is zstd-compressed on Linux only.
    "zstandard; sys_platform == 'linux'",
]

[project.scripts]
plainbook = "plainbook.main:main"

[project.urls]
# Links displayed on the PyPI project page
Homepage = "https://github.com/plainbook-ai/plainbook"
Issues = "https://github.com/plainbook-ai/plainbook/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["plainbook*"]

[tool.setuptools.package-data]
plainbook = ["js/**/*", "css/**/*", "views/*", "images/*"]

[tool.setuptools.exclude-package-data]
plainbook = ["css/node_modules/**/*", "css/package-lock.json", "css/package.json"]
